services:
  - type: web
    name: academy-management-crm
    env: node
    plan: standard
    buildCommand: npx prisma generate && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./db/dev.db
