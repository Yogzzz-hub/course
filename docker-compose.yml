services:
  # ----------------------------------------------------------------------------
  # Next.js Full-Stack Academy Platform (Frontend + Backend APIs)
  # ----------------------------------------------------------------------------
  academy-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academy-management-crm
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/dev.db
      - JWT_SECRET=${JWT_SECRET:-academy-dev-secret-key-replace-in-production}
      - NEXT_PUBLIC_APP_NAME=Apex Global Academy
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - DEV_OTP_TEST_MODE=false
    volumes:
      - academy-data:/app/db

  # ----------------------------------------------------------------------------
  # Production PostgreSQL Database (Optional - uncomment if using PostgreSQL)
  # ----------------------------------------------------------------------------
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: academy-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: academy
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD required}
  #     POSTGRES_DB: academy_crm
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

volumes:
  academy-data:
  postgres-data:
